name: Submit rollbar

on:
  workflow_dispatch:

jobs:
  kodi-addon-submitter:
    runs-on: ubuntu-latest
    name: Kodi addon submitter
    if: github.repository == 'zim514/script.module.pyrollbar'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check the GH_TOKEN scopes
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        # A classic token needs repo (or public_repo) to push to the fork. Note that the
        # permissions field of the repository API describes the account rather than the
        # token, so it reports push access even for a token that has no scope at all.
        if ! gh api user --jq .login > /dev/null; then
          echo "::error::GH_TOKEN is not a usable credential. Check that the secret is set and the token has not expired."
          exit 1
        fi
        scopes=$(gh api -i user 2> /dev/null | tr -d '\r' | awk -F': ' 'tolower($1) == "x-oauth-scopes" {print $2}')
        echo "Token scopes: ${scopes:-<none reported, fine-grained token>}"
        case ",${scopes// /}," in
          *,repo,*|*,public_repo,*) echo "Token carries a scope that allows pushing." ;;
          *) echo "::warning::GH_TOKEN does not report the repo or public_repo scope. The push below will show whether it can write." ;;
        esac

    - name: Push the addon branch to the repo-scripts fork
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        # The submitter action performs this same push with its output sent to /dev/null and
        # its exit code ignored, so when it fails the run continues and only breaks later on
        # an unresolvable pull request head. Doing it here surfaces the actual git error, and
        # leaves the branch in place for the action's pull request step.
        set -x
        fork="${{ github.actor }}/repo-scripts"
        branch="script.module.pyrollbar@matrix"
        version=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$GITHUB_WORKSPACE/script.module.pyrollbar/addon.xml').getroot().get('version'))")
        git clone --branch matrix --origin upstream --single-branch --depth 1 https://github.com/xbmc/repo-scripts.git /tmp/repo-scripts
        cd /tmp/repo-scripts
        git config user.name "${{ github.actor }}"
        git config user.email "${{ secrets.EMAIL }}"
        git checkout -b "$branch" upstream/matrix
        rm -rf script.module.pyrollbar
        cp -r "$GITHUB_WORKSPACE/script.module.pyrollbar" script.module.pyrollbar
        git add -- script.module.pyrollbar
        git commit -m "[script.module.pyrollbar] $version" || echo "Nothing to commit, the branch matches the repository already"
        git push -f "https://${{ github.actor }}:${GH_TOKEN}@github.com/${fork}.git" "$branch"
        set +x
        # Confirm the ref really landed, rather than trusting the exit code alone
        gh api "repos/${fork}/branches/${branch}" --jq '"pushed: \(.name) -> \(.commit.sha[0:7])"'

    - name: Submit to official kodi repository
      id: kodi-addon-submitter
      uses: xbmc/action-kodi-addon-submitter@master
      with: # Replace all the below values
        kodi-repository: repo-scripts
        kodi-version: matrix
        addon-id: script.module.pyrollbar
        kodi-matrix: false # Submit a Python 2/3 compatible addon to matrix branch in addition to the target branch
        sub-directory: true #Addon is stored in its own directory within the git repo
        #push-only: true # Only push to your repo fork and not create a pull request'
      env: # Make sure you create the below secrets (GH_TOKEN and EMAIL)
        GH_USERNAME: ${{ github.actor }}
        GH_TOKEN: ${{secrets.GH_TOKEN}}
        EMAIL: ${{secrets.EMAIL}}
